# A short-lived GitHub Mac or Windows machine you can see and control from your Mac,
# for hands-on tests of the buyer flow. Reached through Tailscale (private network).
# Start: ./start.sh macos 60   (or: gh workflow run remote-desktop.yml -f os=macos -f minutes=60)
# Stop early: ./stop.sh  (Step Guide is unpacked on the Desktop; Kit test keys: tools/license.py in ai-assistant-kit)
# Secrets: TAILSCALE_GITHUB_AUTH_KEY (Tailscale auth key, ephemeral), RD_PASSWORD (login password for the remote user).
name: remote-desktop

on:
  workflow_dispatch:
    inputs:
      os:
        description: macos or windows
        type: choice
        options: [macos, windows]
        default: macos
      minutes:
        description: How long to keep the machine on (max 340)
        type: number
        default: 60

jobs:
  desktop:
    runs-on: ${{ inputs.os == 'windows' && 'windows-latest' || 'macos-latest' }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Join Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_GITHUB_AUTH_KEY }}
          hostname: gha-${{ inputs.os }}-${{ github.run_id }}

      - name: Enable Screen Sharing (macOS)
        if: inputs.os == 'macos'
        env:
          RD_PASSWORD: ${{ secrets.RD_PASSWORD }}
        # Apple: "In macOS 12.1 or later, Screen Sharing can't be enabled by the kickstart command-line tool"
        # (support.apple.com/guide/remote-desktop/apd8b1c65bd), so a user-name login is refused ("Screen Sharing is not
        # permitted"). kickstart can still turn on the legacy VNC password, which shares the logged-in desktop (runner).
        # Same steps as github.com/prateeknot/macos-cloud (macOS 26 runners). VNC uses only the first 8 characters.
        run: |
          sw_vers -productVersion
          K=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
          VNC_PW="${RD_PASSWORD:0:8}"
          sudo $K -activate
          sudo $K -configure -allowAccessFor -allUsers -privs -all
          sudo $K -configure -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$VNC_PW"
          # Some macOS builds ignore -setvncpw, so also write the obfuscated settings file (not to the log).
          printf '%s' "$VNC_PW" | perl -we 'BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA" }; $_ = <>; chomp; s/^(.{8}).*/$1/; @p = unpack "C*", $_; foreach (@k) { printf "%02X", $_ ^ (shift @p || 0) }; print "\n"' \
            | sudo tee /Library/Preferences/com.apple.VNCSettings.txt >/dev/null
          # A headless runner whose display sleeps or locks streams a black screen: keep it awake and unlocked.
          sudo pmset -a sleep 0 displaysleep 0 disksleep 0 || true
          sudo defaults write /Library/Preferences/com.apple.screensaver askForPassword -int 0 || true
          sudo defaults write /Library/Preferences/com.apple.loginwindow DisableScreenLock -bool true || true
          sudo "/Library/Application Support/VMware Tools/vmware-resolutionSet" 1920 1080 2>/dev/null || true
          sudo $K -restart -agent -console
          python3 -c "import socket; s=socket.create_connection(('127.0.0.1',5900),10); print('VNC server:', s.recv(12))"
          echo "console user: $(stat -f%Su /dev/console)"
          # SSH for commands (key in authorized_keys)
          sudo systemsetup -setremotelogin on || sudo launchctl load -w /System/Library/LaunchDaemons/ssh.plist
          mkdir -p ~/.ssh && cat authorized_keys >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          echo "Connect: Screen Sharing -> vnc://$(tailscale ip -4)  password: first 8 characters of RD_PASSWORD  (ssh runner@$(tailscale ip -4))"

      - name: Enable Remote Desktop (Windows)
        if: inputs.os == 'windows'
        shell: pwsh
        env:
          RD_PASSWORD: ${{ secrets.RD_PASSWORD }}
        run: |
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Set-LocalUser -Name runneradmin -Password (ConvertTo-SecureString $env:RD_PASSWORD -AsPlainText -Force)
          # SSH for commands from the Mac (key in authorized_keys); shell = Windows PowerShell like a buyer's.
          if (-not (Get-Service sshd -ErrorAction SilentlyContinue)) {
            try { Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 -ErrorAction Stop | Out-Null }
            catch { choco install openssh -y --no-progress --params '"/SSHServerFeature"' | Out-Null }
          }
          Copy-Item authorized_keys C:\ProgramData\ssh\administrators_authorized_keys -Force
          icacls C:\ProgramData\ssh\administrators_authorized_keys /inheritance:r /grant 'Administrators:F' /grant 'SYSTEM:F' | Out-Null
          New-ItemProperty -Path HKLM:\SOFTWARE\OpenSSH -Name DefaultShell -PropertyType String -Force `
            -Value C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe | Out-Null
          Set-Service sshd -StartupType Automatic; Start-Service sshd
          Write-Output "Connect: Windows App -> $(tailscale ip -4)  user: runneradmin  (ssh runneradmin@$(tailscale ip -4))"

      - name: Put Step Guide on the Desktop (Chrome → chrome://extensions → Developer mode → Load unpacked)
        shell: bash
        continue-on-error: true
        run: |
          curl -fsSL https://get.jhilmillabs.com/stepguide/step-guide.zip -o step-guide.zip
          mkdir -p ~/Desktop/step-guide && unzip -oq step-guide.zip -d ~/Desktop/step-guide
          echo "Step Guide: ~/Desktop/step-guide"

      - name: Keep the machine on
        shell: bash
        # Short sleeps: one long sleep ignores a cancel on Windows and the run stays "in progress".
        run: |
          end=$(( SECONDS + ${{ inputs.minutes }} * 60 ))
          while [ $SECONDS -lt $end ]; do sleep 15; done
